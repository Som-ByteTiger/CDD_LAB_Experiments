name: Experiment 7 - Calculator SSK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calculator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run calculator
        run: python Github_actions_demo_SSK/calculator.py
